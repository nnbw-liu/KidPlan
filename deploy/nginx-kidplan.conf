# =============================================================================
# KidPlan —— 宝塔面板 Nginx 站点反向代理配置（可直接粘贴）
#
# 用法（二选一）：
#   A. 宝塔 → 网站 → 你的站点 → 配置文件：把下面 server { ... } 里的内容
#      合并/替换进宝塔生成的 server 块（保留宝塔自己的 SSL 相关行）。
#   B. 宝塔 → 网站 → 你的站点 → 反向代理：添加代理到 http://127.0.0.1:8080，
#      然后编辑生成的 proxy 配置，用本文件内容替换。
#
# 【WebSocket 关键说明】Blazor Server 通过 SignalR 通信，浏览器会尝试用
# WebSocket 升级连接。只要下面这 4 行缺失或写错（尤其是 Connection 头被
# 一律置为 "close"），页面就会反复提示“正在重新连接”。
#   proxy_http_version 1.1;
#   proxy_set_header Upgrade    $http_upgrade;
#   proxy_set_header Connection "upgrade";
#   proxy_read_timeout / proxy_send_timeout 足够长
#
# ⚠️ 本文件必须放在 server { } 内。
#    map 指令只能出现在 nginx 的 http { } 上下文，不能写进 site 的 server 块。
#    宝塔把站点配置 include 在 http 上下文内、但本站点文件本身处于 server 层级，
#    所以这里直接写 Connection "upgrade"（最稳，无需依赖全局 map）。
#    如果你的宝塔版本已经在 http 层定义了 $connection_upgrade 变量
#    （可在 /www/server/nginx/conf/nginx.conf 里 grep connection_upgrade 确认），
#    也可以把下面那行换成：
#        proxy_set_header Connection $connection_upgrade;
#    权衡：写死 "upgrade" 表示所有代理请求都带 Upgrade 头，对普通 HTTP 请求
#    是无害的（服务端会忽略），代价只是少一点健壮性；而引用未定义的变量会直接
#    导致 nginx 启动失败。因此这里默认选用写死 "upgrade"。
# =============================================================================

server {
    # 把 80 改掉前请先想清楚：宝塔的 SSL 与强制 HTTPS 依赖 80/443 的 server 块，
    # 这一行通常保持宝塔自动生成的值即可。
    listen 80;
    # 【替换】改成你自己的域名
    server_name kidplan.example.com;

    # 上传头像等文件用得到，避免 413 Request Entity Too Large
    client_max_body_size 20m;

    # 访问日志（宝塔默认路径）
    access_log /www/wwwlogs/kidplan.log;
    error_log  /www/wwwlogs/kidplan.error.log;

    # ---------------------------------------------------------------------
    # 健康检查：给宝塔的“网站监控 / 负载均衡”探针使用，不写日志减少噪音
    # ---------------------------------------------------------------------
    location = /healthz {
        proxy_pass http://127.0.0.1:8080/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # ---------------------------------------------------------------------
    # 主代理：Blazor Server / SignalR
    # ---------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:8080;

        # ==== WebSocket 关键 1：必须 1.1，1.0 不支持 Upgrade ====
        proxy_http_version 1.1;

        # ==== WebSocket 关键 2：透传浏览器的 Upgrade 头 ====
        proxy_set_header Upgrade    $http_upgrade;

        # ==== WebSocket 关键 3：不能改成 "close" ====
        # 写死 "upgrade" 见文件头说明；已定义 $connection_upgrade 的环境可换成变量。
        proxy_set_header Connection "upgrade";

        # 传递真实请求信息，否则应用里拿到的 Host / 客户端 IP / 协议都是错的
        # （Identity 的 cookie 域、防盗链、日志都会受影响）
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ==== WebSocket 关键 4：SignalR 长连接默认 60s 会被掐断 ====
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 30s;

        # 关闭缓冲，否则 Blazor 的交互式响应会被攒着不发，表现为界面“卡住/延迟”
        proxy_buffering off;
        proxy_request_buffering off;

        # 不要把后端的重定向改写成 http，否则 HTTPS 站点会降级
        proxy_redirect off;
    }

    # ---------------------------------------------------------------------
    # 本机中继端点：/api/relay/connect
    #
    # 客户端电脑上的 KidPlan.Relay 会主动连到这里，之后服务器就顺着这条长连接
    # 把模型请求发回那台电脑（用来接「服务端不在同一局域网」的本地模型）。
    #
    # 它和 Blazor 一样是 WebSocket，所以 Upgrade / Connection 两行一个都不能少。
    # 额外注意 proxy_read_timeout：这条连接会在两次请求之间长时间空闲
    # （客户端每 20 秒发一次心跳），超时设小了会被 Nginx 定期掐断，
    # 表现是「中继页显示在线、隔一会儿就掉线，反复重连」。
    #
    # 这条 location 本来会被下面的 location / 覆盖到，单独写出来的意义是：
    # 让「中继依赖 WebSocket」这件事在配置里显式可见，也避免将来给 /api/ 加
    # 缓存类规则时不小心把它一起缓存掉。
    # ---------------------------------------------------------------------
    location = /api/relay/connect {
        proxy_pass http://127.0.0.1:8080;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 30s;

        proxy_buffering off;
        proxy_redirect off;
    }

    # ---------------------------------------------------------------------
    # 静态资源（_framework / _content 等）：由 Nginx 直接带上长缓存
    # Blazor 的资源文件名里带指纹，可以放心长缓存，能明显减轻服务器压力
    # ---------------------------------------------------------------------
    location ~* ^/(_framework|_content|_blazor|css|js|lib|images)/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # ---------------------------------------------------------------------
    # SSL / HTTPS：
    #   不要在这里手写证书路径，宝塔会在“网站 → SSL”标签页自动插入
    #   listen 443 ssl; 、ssl_certificate ... 等配置，并在开启“强制 HTTPS”后
    #   自动加上 80 → 443 的跳转。手写容易与宝塔生成的内容冲突。
    #   申请 Let's Encrypt 证书：网站 → SSL → Let's Encrypt → 申请。
    # ---------------------------------------------------------------------
}
